name: Cloud agent image

# Builds the legalese-cloud-agent image (cloud-sessions spec §5.3, §14):
# jl4-lsp for linux-arm64 (as main-tag.yml's build-lsp-linux-arm64 does),
# the cloud-agent esbuild bundle, a linux/arm64 image, a smoke test, a push
# to ECR as legalese-cloud-agent:<git sha>, and the digest written to SSM
# /cloud-sessions/<env>/image-digest — the parameter the Sessions API
# compares task definitions against. Rolling back = setting that parameter
# to the previous digest.
#
# AWS access: GitHub OIDC → the role cloud-sessions-<env>-agent-image-github
# (jl4-auth-proxy cloud-sessions/terraform/github-actions.tf). Its ARN comes
# from the repository secret CLOUD_SESSIONS_AGENT_IMAGE_ROLE_ARN.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (cloud-sessions-<env>)"
        required: true
        default: prod
        type: choice
        options: [prod]
      publish:
        description: "Push to ECR and write the image-digest parameter (off = build and smoke-test only)"
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "ts-shared/legalese-agent/**"
      - "ts-apps/cloud-agent/**"
      - "jl4-lsp/**"
      - "jl4-core/**"
      - ".github/workflows/cloud-agent-image.yml"

permissions:
  id-token: write # OIDC → AWS role assumption
  contents: read

concurrency:
  group: cloud-agent-image-${{ github.ref }}
  cancel-in-progress: false

env:
  GHC_VERSION: "9.10.2"
  AWS_REGION: us-west-2
  ECR_REPOSITORY: legalese-cloud-agent
  ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Same steps as main-tag.yml build-lsp-linux-arm64 (only jl4-lsp).
  jl4-lsp:
    name: Build jl4-lsp - Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "Retry $i: apt-get update failed, waiting 10s..."
            sleep 10
          done
          sudo apt-get install -y pkg-config liblzma-dev libgmp-dev

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "latest"
          cabal-update: true

      - name: Configure and generate build plan
        run: |
          cabal update
          cabal configure --disable-documentation
          cabal build exe:jl4-lsp --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: cache
        env:
          key: lsp-linux-arm64-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build exe:jl4-lsp --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build jl4-lsp
        run: cabal build exe:jl4-lsp

      - name: Copy and strip the binary
        run: |
          mkdir -p bin
          cp "$(cabal list-bin exe:jl4-lsp)" bin/jl4-lsp
          strip bin/jl4-lsp || true
          chmod +x bin/jl4-lsp
          ls -lh bin/

      - uses: actions/upload-artifact@v6
        with:
          name: cloud-agent-jl4-lsp-linux-arm64
          path: bin/jl4-lsp
          retention-days: 7

  image:
    name: Build, smoke-test and publish the image
    needs: jl4-lsp
    # Native arm64 runner: no QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and bundle the harness
        run: |
          npx turbo build --filter=cloud-agent
          npm test --workspace=cloud-agent

      - uses: actions/download-artifact@v8
        with:
          name: cloud-agent-jl4-lsp-linux-arm64
          path: ts-apps/cloud-agent/bin

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (linux/arm64)
        working-directory: ts-apps/cloud-agent
        run: |
          chmod +x bin/jl4-lsp
          docker buildx build \
            --platform linux/arm64 \
            --file docker/Dockerfile \
            --tag "local/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            --load \
            .
          docker image ls "local/${ECR_REPOSITORY}"

      - name: Smoke test
        working-directory: ts-apps/cloud-agent
        run: docker/smoke.sh "local/${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Configure AWS credentials
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.CLOUD_SESSIONS_AGENT_IMAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: env.PUBLISH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push legalese-cloud-agent:<sha>
        if: env.PUBLISH == 'true'
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          REMOTE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          # Tags are immutable: a re-run for the same commit reuses the image.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Tag ${GITHUB_SHA} already exists; not pushing again."
          else
            docker tag "local/${ECR_REPOSITORY}:${GITHUB_SHA}" "$REMOTE"
            docker push "$REMOTE"
          fi
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "unexpected digest: $DIGEST" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$REMOTE" >> "$GITHUB_OUTPUT"

      - name: Roll out (write the image-digest parameter)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          PARAM="/cloud-sessions/${ENVIRONMENT}/image-digest"
          PREVIOUS=$(aws ssm get-parameter --name "$PARAM" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "UNSET")
          aws ssm put-parameter --name "$PARAM" --type String \
            --value "$DIGEST" --overwrite >/dev/null
          {
            echo "## legalese-cloud-agent (\`${ENVIRONMENT}\`)"
            echo ""
            echo "- Image: \`${{ steps.push.outputs.image }}\`"
            echo "- Digest: \`${DIGEST}\` → \`${PARAM}\`"
            echo "- Previous digest: \`${PREVIOUS}\`"
            echo ""
            echo "New sessions (and sleeping sessions on their next start) use this image;"
            echo "running sessions keep theirs until they sleep. To roll back:"
            echo ""
            echo "\`aws ssm put-parameter --name ${PARAM} --type String --overwrite --value ${PREVIOUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
