name: Main Branch Tag

# Manual-only: this release/tag pipeline no longer runs automatically when a PR
# merges into main. Trigger it from the Actions tab (Run workflow) when you
# actually want to cut a build/tag.
on:
  workflow_dispatch:

# Only run one release build at a time
concurrency:
  group: main-release
  cancel-in-progress: false

env:
  GHC_VERSION: "9.10.2"
  GHC_WASM_VERSION: "9.10"

jobs:
  # ============================================
  # Build LSP binaries for each platform
  # ============================================

  build-lsp-macos-arm64:
    name: Build jl4-lsp + l4 - macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "latest"
          cabal-update: true

      # GHC's rts package hard-codes the Command Line Tools SDK, so every link
      # gets -L/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib, but
      # ld comes from the selected Xcode. When the image's CLT is newer than its
      # Xcode (CLT 27 beside Xcode 26.6 since image 20261013), that ld cannot read
      # the newer SDK's .tbd files ("unknown architecture arm64e.x1-macos").
      # Point the rts at the selected Xcode's own SDK, so ld and SDK match.
      - name: Point GHC at the selected Xcode's SDK
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          db=$(ghc --print-libdir)/package.conf.d
          sed -i '' "s|/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk|$sdk|g" "$db"/*.conf
          ghc-pkg recache --global
          ghc-pkg field rts library-dirs,include-dirs --global

      - name: Configure and generate build plan
        run: |
          cabal update
          cabal configure --enable-tests --disable-documentation
          cabal build exe:jl4-lsp exe:l4 test:l4-cli-test --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: cache
        env:
          key: lsp-macos-arm64-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      # What `l4 --version` reports (LSP.L4.BuildInfo bakes it in at compile time).
      # This is before "Install dependencies", which compiles the local libraries
      # too: one compiled without these variables says `dev`, and the build step
      # after it finds it up to date.
      - name: Name the build
        run: |
          bash etc/build-identity.sh >> "$GITHUB_ENV"
          tail -n 4 "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build exe:jl4-lsp exe:l4 test:l4-cli-test --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build jl4-lsp and l4
        run: cabal build exe:jl4-lsp exe:l4

      - name: Run l4 CLI test suite
        timeout-minutes: 20
        run: |
          test -n "$L4_BUILD_RELEASE" || { echo "::error::L4_BUILD_RELEASE is empty, so l4 and jl4-lsp say dev: the Name the build step did not run"; exit 1; }
          cabal test l4-cli-test --test-show-details=streaming

      - name: Copy and process binaries
        run: |
          mkdir -p bin/darwin-arm64
          cp $(cabal list-bin exe:jl4-lsp) bin/darwin-arm64/jl4-lsp
          cp $(cabal list-bin exe:l4)      bin/darwin-arm64/l4
          strip bin/darwin-arm64/jl4-lsp || true
          strip bin/darwin-arm64/l4      || true
          codesign -s - bin/darwin-arm64/jl4-lsp || true
          codesign -s - bin/darwin-arm64/l4      || true
          chmod +x bin/darwin-arm64/jl4-lsp bin/darwin-arm64/l4
          ls -lh bin/darwin-arm64/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: jl4-lsp-darwin-arm64
          path: bin/darwin-arm64/
          retention-days: 90

  build-lsp-windows:
    name: Build jl4-lsp + l4 - Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "latest"
          cabal-update: true

      - name: Configure and build
        shell: bash
        run: |
          cabal update
          cabal configure --enable-tests --disable-documentation
          cabal build exe:jl4-lsp exe:l4 test:l4-cli-test --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: cache
        env:
          key: lsp-windows-x64-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      # What `l4 --version` reports (LSP.L4.BuildInfo bakes it in at compile time).
      # This is before "Install dependencies", which compiles the local libraries
      # too: one compiled without these variables says `dev`, and the build step
      # after it finds it up to date.
      - name: Name the build
        shell: bash
        run: |
          bash etc/build-identity.sh >> "$GITHUB_ENV"
          tail -n 4 "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cabal build exe:jl4-lsp exe:l4 test:l4-cli-test --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build jl4-lsp and l4
        shell: bash
        run: cabal build exe:jl4-lsp exe:l4

      - name: Run l4 CLI test suite
        timeout-minutes: 20
        shell: bash
        run: |
          test -n "$L4_BUILD_RELEASE" || { echo "::error::L4_BUILD_RELEASE is empty, so l4 and jl4-lsp say dev: the Name the build step did not run"; exit 1; }
          cabal test l4-cli-test --test-show-details=streaming

      - name: Copy binaries
        shell: bash
        run: |
          mkdir -p bin/win32-x64
          cp $(cabal list-bin exe:jl4-lsp) bin/win32-x64/jl4-lsp.exe
          cp $(cabal list-bin exe:l4)      bin/win32-x64/l4.exe
          ls -lh bin/win32-x64/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: jl4-lsp-win32-x64
          path: bin/win32-x64/
          retention-days: 90

  build-lsp-linux-x64:
    name: Build jl4-lsp + l4 + jl4-service - Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Bake the build version (<major>.<minor> of the VS Code extension, then
      # the run number, matching the l4-ide-build-<run_number> tag) into the
      # jl4-service binary via the JL4_SERVICE_VERSION env var, which the
      # Version module captures with a Template Haskell splice at compile time.
      # It must be set before any step compiles jl4-service, and "Install
      # dependencies" does: for exe:jl4-service it builds the package's own
      # library, Version.hs included. Neither cabal nor GHC rebuilds a module
      # whose source is unchanged when only an environment variable changed
      # (touching the file does not help, as both compare contents), so a
      # library compiled before this step keeps 0.0.0-dev. Build 95 shipped
      # that way. "Check the baked jl4-service version" below catches it.
      - name: Compute jl4-service version
        run: |
          CURRENT=$(grep -m1 '"version"' ts-apps/vscode/package.json | sed -E 's/.*"version" *: *"([^"]+)".*/\1/')
          MAJOR_MINOR=$(echo "$CURRENT" | sed 's/\.[^.]*$//')
          echo "JL4_SERVICE_VERSION=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "jl4-service version: ${MAJOR_MINOR}.${{ github.run_number }}"

      # What `l4 --version` and `jl4-lsp --version` report (LSP.L4.BuildInfo bakes it
      # in at compile time). The same constraint as the version above: it must be
      # set before any step compiles the local libraries, which "Install
      # dependencies" does. A library compiled without these variables says `dev`,
      # and the build step after it finds it up to date; the l4 CLI test suite
      # checks the binaries against these variables.
      - name: Name the build
        run: |
          bash etc/build-identity.sh >> "$GITHUB_ENV"
          tail -n 4 "$GITHUB_ENV"

      - name: Install system dependencies
        timeout-minutes: 5
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30
        run: |
          for i in 1 2 3; do
            sudo apt-get $APT_OPTIONS update && break
            echo "Retry $i: apt-get update failed, waiting 10s..."
            sleep 10
          done
          sudo apt-get $APT_OPTIONS install -y pkg-config liblzma-dev libgmp-dev

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "latest"
          cabal-update: true

      - name: Configure and build
        run: |
          cabal update
          cabal configure --enable-tests --disable-documentation
          cabal build exe:jl4-lsp exe:l4 exe:jl4-service test:l4-cli-test --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: cache
        env:
          key: lsp-linux-x64-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build exe:jl4-lsp exe:l4 exe:jl4-service test:l4-cli-test --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build jl4-lsp, l4, and jl4-service
        run: cabal build exe:jl4-lsp exe:l4 exe:jl4-service

      - name: Run l4 CLI test suite
        timeout-minutes: 20
        run: |
          test -n "$L4_BUILD_RELEASE" || { echo "::error::L4_BUILD_RELEASE is empty, so l4 and jl4-lsp say dev: the Name the build step did not run"; exit 1; }
          cabal test l4-cli-test --test-show-details=streaming

      - name: Copy and process binaries
        run: |
          mkdir -p bin/linux-x64
          cp $(cabal list-bin exe:jl4-lsp) bin/linux-x64/jl4-lsp
          cp $(cabal list-bin exe:l4)      bin/linux-x64/l4
          strip bin/linux-x64/jl4-lsp || true
          strip bin/linux-x64/l4      || true
          chmod +x bin/linux-x64/jl4-lsp bin/linux-x64/l4

          cp $(cabal list-bin exe:jl4-service) bin/linux-x64/jl4-service
          strip bin/linux-x64/jl4-service || true
          chmod +x bin/linux-x64/jl4-service

          # Generate SHA256 for jl4-service
          sha256sum bin/linux-x64/jl4-service | awk '{print $1}' > bin/linux-x64/jl4-service.sha256
          echo "jl4-service SHA256: $(cat bin/linux-x64/jl4-service.sha256)"

          ls -lh bin/linux-x64/

      # The binary that is released must say the version it is released as:
      # production reads it from /health, and new deployments take their major
      # version from it.
      - name: Check the baked jl4-service version
        run: |
          store=$(mktemp -d)
          bin/linux-x64/jl4-service --port 18080 --store-path "$store" > "$RUNNER_TEMP/jl4-service-check.log" 2>&1 &
          pid=$!
          reported=""
          for _ in $(seq 1 30); do
            if body=$(curl -sf http://127.0.0.1:18080/health); then
              reported=$(jq -r '.version // empty' <<<"$body")
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ -z "$reported" ]; then
            echo "::error::jl4-service gave no version on /health within 30 s"
            cat "$RUNNER_TEMP/jl4-service-check.log"
            exit 1
          fi
          echo "jl4-service reports version: $reported"
          if [ "$reported" != "$JL4_SERVICE_VERSION" ]; then
            echo "::error::jl4-service reports version $reported, expected $JL4_SERVICE_VERSION"
            exit 1
          fi

      - name: Upload LSP + CLI binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: jl4-lsp-linux-x64
          path: |
            bin/linux-x64/jl4-lsp
            bin/linux-x64/l4
          retention-days: 90

      - name: Upload jl4-service artifact
        uses: actions/upload-artifact@v6
        with:
          name: jl4-service-linux-x64
          path: |
            bin/linux-x64/jl4-service
            bin/linux-x64/jl4-service.sha256
          retention-days: 90

  build-lsp-linux-arm64:
    name: Build jl4-lsp + l4 - Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install system dependencies
        timeout-minutes: 5
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30
        run: |
          for i in 1 2 3; do
            sudo apt-get $APT_OPTIONS update && break
            echo "Retry $i: apt-get update failed, waiting 10s..."
            sleep 10
          done
          sudo apt-get $APT_OPTIONS install -y pkg-config liblzma-dev libgmp-dev

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "latest"
          cabal-update: true

      - name: Configure and build
        run: |
          cabal update
          cabal configure --enable-tests --disable-documentation
          cabal build exe:jl4-lsp exe:l4 test:l4-cli-test --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: cache
        env:
          key: lsp-linux-arm64-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      # What `l4 --version` reports (LSP.L4.BuildInfo bakes it in at compile time).
      # This is before "Install dependencies", which compiles the local libraries
      # too: one compiled without these variables says `dev`, and the build step
      # after it finds it up to date.
      - name: Name the build
        run: |
          bash etc/build-identity.sh >> "$GITHUB_ENV"
          tail -n 4 "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build exe:jl4-lsp exe:l4 test:l4-cli-test --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build jl4-lsp and l4
        run: cabal build exe:jl4-lsp exe:l4

      - name: Run l4 CLI test suite
        timeout-minutes: 20
        run: |
          test -n "$L4_BUILD_RELEASE" || { echo "::error::L4_BUILD_RELEASE is empty, so l4 and jl4-lsp say dev: the Name the build step did not run"; exit 1; }
          cabal test l4-cli-test --test-show-details=streaming

      - name: Copy and process binaries
        run: |
          mkdir -p bin/linux-arm64
          cp $(cabal list-bin exe:jl4-lsp) bin/linux-arm64/jl4-lsp
          cp $(cabal list-bin exe:l4)      bin/linux-arm64/l4
          strip bin/linux-arm64/jl4-lsp || true
          strip bin/linux-arm64/l4      || true
          chmod +x bin/linux-arm64/jl4-lsp bin/linux-arm64/l4
          ls -lh bin/linux-arm64/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: jl4-lsp-linux-arm64
          path: bin/linux-arm64/
          retention-days: 90

  # ============================================
  # Build the cloud agent bundle
  # ============================================

  # The headless Legalese AI harness for cloud sessions. This repository only
  # publishes it (with jl4-lsp-linux-arm64) as release assets.
  build-cloud-agent:
    name: Build cloud agent bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test the harness
        run: |
          npx turbo build --filter=cloud-agent
          npm test --workspace=cloud-agent

      - name: Hash the bundle
        working-directory: ts-apps/cloud-agent/dist
        run: |
          sha256sum cloud-agent.cjs | awk '{print $1}' > cloud-agent.cjs.sha256
          echo "cloud-agent.cjs SHA256: $(cat cloud-agent.cjs.sha256)"
          ls -lh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: cloud-agent
          path: |
            ts-apps/cloud-agent/dist/cloud-agent.cjs
            ts-apps/cloud-agent/dist/cloud-agent.cjs.sha256
          retention-days: 90

  # ============================================
  # Build WASM
  # ============================================

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare-artifacts.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils binaryen

      - name: Cache GHC WASM toolchain
        id: cache-ghc-wasm
        uses: actions/cache@v5
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ env.GHC_WASM_VERSION }}-${{ runner.os }}

      - name: Install GHC WASM toolchain
        if: steps.cache-ghc-wasm.outputs.cache-hit != 'true'
        run: |
          curl -L https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/raw/master/bootstrap.sh | FLAVOUR=${{ env.GHC_WASM_VERSION }} bash
        shell: bash

      - name: Cache WASM dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.ghc-wasm/.cabal/store
            dist-newstyle
          key: wasm-deps-${{ env.GHC_WASM_VERSION }}-${{ hashFiles('cabal-wasm.project', 'jl4-core/jl4-core.cabal', 'jl4-wasm/jl4-wasm.cabal') }}
          restore-keys: |
            wasm-deps-${{ env.GHC_WASM_VERSION }}-

      - name: Build WASM binary
        run: |
          source ~/.ghc-wasm/env
          wasm32-wasi-cabal update
          wasm32-wasi-cabal build jl4-wasm --project-file=cabal-wasm.project

      - name: Generate JS FFI glue code
        run: |
          source ~/.ghc-wasm/env
          WASM_PATH=$(find dist-newstyle -name 'jl4-wasm.wasm' -path '*/opt/build/*' | head -1)
          $(wasm32-wasi-ghc --print-libdir)/post-link.mjs -i "$WASM_PATH" -o dist-newstyle/jl4-wasm.mjs

      - name: Optimize WASM binary
        run: |
          WASM_PATH=$(find dist-newstyle -name 'jl4-wasm.wasm' -path '*/opt/build/*' | head -1)
          wasm-opt -Oz "$WASM_PATH" -o "$WASM_PATH.opt"
          mv "$WASM_PATH.opt" "$WASM_PATH"

      - name: Prepare artifacts
        id: prepare-artifacts
        run: |
          mkdir -p wasm-artifacts
          WASM_PATH=$(find dist-newstyle -name 'jl4-wasm.wasm' -path '*/opt/build/*' | head -1)
          cp "$WASM_PATH" wasm-artifacts/jl4-core.wasm
          cp dist-newstyle/jl4-wasm.mjs wasm-artifacts/jl4-core.mjs

          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:8}"
          DATE=$(date -u +%Y%m%d)
          VERSION="${DATE}-${SHORT_SHA}"
          echo "$VERSION" > wasm-artifacts/version.txt
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: jl4-wasm-${{ steps.prepare-artifacts.outputs.version }}
          path: wasm-artifacts/
          retention-days: 90

  # ============================================
  # Package platform-specific VSCode extensions
  # ============================================

  package-vscode-extension:
    name: Package VSCode Extension - ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs:
      - build-lsp-macos-arm64
      - build-lsp-windows
      - build-lsp-linux-x64
      - build-lsp-linux-arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            artifact: jl4-lsp-darwin-arm64
          - target: win32-x64
            artifact: jl4-lsp-win32-x64
          - target: linux-x64
            artifact: jl4-lsp-linux-x64
          - target: linux-arm64
            artifact: jl4-lsp-linux-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update package.json version with build number
        working-directory: ts-apps/vscode
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo $CURRENT_VERSION | sed 's/\.[^.]*$//')
          NEW_VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          echo "Updating version: $CURRENT_VERSION -> $NEW_VERSION"
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.version = '$NEW_VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          echo "PACKAGE_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Build TypeScript monorepo
        run: npm run build

      - name: Download LSP + l4 binaries
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ts-apps/vscode/bin/${{ matrix.target }}

      - name: Make binaries executable
        if: matrix.target != 'win32-x64'
        run: |
          chmod +x ts-apps/vscode/bin/${{ matrix.target }}/jl4-lsp
          chmod +x ts-apps/vscode/bin/${{ matrix.target }}/l4

      - name: Copy L4 libraries
        run: |
          mkdir -p ts-apps/vscode/libraries
          cp jl4-core/libraries/*.l4 ts-apps/vscode/libraries/

      - name: Package platform-specific extension
        working-directory: ts-apps/vscode
        run: |
          npx vsce package --target ${{ matrix.target }} --no-dependencies -o l4-vscode-${{ matrix.target }}-${{ env.PACKAGE_VERSION }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: l4-vscode-${{ matrix.target }}-${{ env.PACKAGE_VERSION }}
          path: ts-apps/vscode/*.vsix
          retention-days: 90

  # ============================================
  # Package cross-platform extension (macOS + Windows)
  # ============================================

  package-vscode-cross-platform:
    name: Package VSCode Extension - Cross Platform
    runs-on: ubuntu-latest
    needs:
      - build-lsp-macos-arm64
      - build-lsp-windows
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update package.json version with build number
        working-directory: ts-apps/vscode
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo $CURRENT_VERSION | sed 's/\.[^.]*$//')
          NEW_VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.version = '$NEW_VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          echo "PACKAGE_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Build TypeScript monorepo
        run: npm run build

      - name: Download macOS + Windows LSP binaries
        uses: actions/download-artifact@v8
        with:
          pattern: jl4-lsp-{darwin-arm64,win32-x64}
          path: ts-apps/vscode/bin

      - name: Organize binaries into correct structure
        run: |
          cd ts-apps/vscode/bin
          mv jl4-lsp-darwin-arm64 darwin-arm64
          mv jl4-lsp-win32-x64 win32-x64
          chmod +x darwin-arm64/jl4-lsp darwin-arm64/l4

      - name: Copy L4 libraries
        run: |
          mkdir -p ts-apps/vscode/libraries
          cp jl4-core/libraries/*.l4 ts-apps/vscode/libraries/

      - name: Package cross-platform extension
        working-directory: ts-apps/vscode
        run: |
          npx vsce package --no-dependencies -o l4-vscode-cross-platform-${{ env.PACKAGE_VERSION }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: l4-vscode-cross-platform-${{ env.PACKAGE_VERSION }}
          path: ts-apps/vscode/*.vsix
          retention-days: 90

  # ============================================
  # Package universal extension (no bundled binary)
  # ============================================

  package-vscode-universal:
    name: Package VSCode Extension - Universal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update package.json version with build number
        working-directory: ts-apps/vscode
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo $CURRENT_VERSION | sed 's/\.[^.]*$//')
          NEW_VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.version = '$NEW_VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          echo "PACKAGE_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Build TypeScript monorepo
        run: npm run build

      - name: Package universal extension
        working-directory: ts-apps/vscode
        run: |
          npx vsce package --no-dependencies -o l4-vscode-universal-${{ env.PACKAGE_VERSION }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: l4-vscode-universal-${{ env.PACKAGE_VERSION }}
          path: ts-apps/vscode/*.vsix
          retention-days: 90

  # ============================================
  # Create Git Tag with Artifacts
  # ============================================

  # ============================================
  # Package the Claude Code plugin and the skill
  # ============================================

  package-plugin:
    name: Package L4 plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The plugin keeps its own <major>.<minor> (from .claude-plugin/plugin.json)
      # and takes this build's run number as the patch, matching the
      # l4-ide-build-<run_number> tag it is released under.
      - name: Set the plugin version
        run: |
          CURRENT=$(jq -r '.version' .claude-plugin/plugin.json)
          VERSION="${CURRENT%.*}.${{ github.run_number }}"
          echo "Plugin version: $VERSION"
          # Both manifests: Claude Code's .claude-plugin/ and the portable
          # Agent Plugins 1.0 one at the plugin root.
          for m in .claude-plugin/plugin.json plugin.json; do
            jq --arg ver "$VERSION" '.version = $ver' "$m" > "$m.tmp"
            mv "$m.tmp" "$m"
          done
          # The marketplace catalog, published at .claude-plugin/ (Claude Code)
          # and .github/plugin/ (Copilot CLI, VS Code); keep them byte-identical.
          jq --arg ver "$VERSION" '.metadata.version = $ver | .plugins[0].version = $ver' \
            .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.tmp
          mv .claude-plugin/marketplace.json.tmp .claude-plugin/marketplace.json
          cp .claude-plugin/marketplace.json .github/plugin/marketplace.json

      - name: Create plugin packages
        run: |
          # Skill only: SKILL.md and its references
          (
            cd skills/writing-l4-rules
            zip -r "$GITHUB_WORKSPACE/writing-l4-rules.skill" \
              assets/ \
              references/ \
              scripts/ \
              SKILL.md \
              -x "*.DS_Store" \
              -x "*/__pycache__/*" \
              -x "*/node_modules/.cache/*"
          )
          # Full plugin: both manifests, the skill and PLUGIN.md
          zip -r l4-plugin.zip \
            .claude-plugin/ \
            plugin.json \
            skills/writing-l4-rules/ \
            PLUGIN.md \
            -x "*.DS_Store" \
            -x "*/__pycache__/*" \
            -x "*/node_modules/.cache/*"
          ls -lh writing-l4-rules.skill l4-plugin.zip
          unzip -l l4-plugin.zip | head -30

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: l4-plugin
          path: |
            l4-plugin.zip
            writing-l4-rules.skill

  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs:
      - package-vscode-extension
      - package-vscode-cross-platform
      - package-vscode-universal
      - build-wasm
      - package-plugin
      - build-cloud-agent
    outputs:
      tag: ${{ steps.tag-name.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Organize artifacts for tag
        run: |
          mkdir -p release-artifacts

          echo "Downloaded artifacts structure:"
          find artifacts -type f

          # Collect VSIX files
          find artifacts -name "*.vsix" -exec cp {} release-artifacts/ \;

          # Collect WASM files
          find artifacts -name "jl4-core.wasm" -exec cp {} release-artifacts/ \;
          find artifacts -name "jl4-core.mjs" -exec cp {} release-artifacts/ \;
          find artifacts -name "version.txt" -exec cp {} release-artifacts/wasm-version.txt \; 2>/dev/null || true

          # Collect the Claude Code plugin and the skill
          find artifacts -name "l4-plugin.zip" -exec cp {} release-artifacts/ \;
          find artifacts -name "writing-l4-rules.skill" -exec cp {} release-artifacts/ \;

          # Collect jl4-service binary and SHA256
          if [ -d artifacts/jl4-service-linux-x64 ]; then
            cp artifacts/jl4-service-linux-x64/jl4-service release-artifacts/jl4-service-linux-x64
            cp artifacts/jl4-service-linux-x64/jl4-service.sha256 release-artifacts/jl4-service-linux-x64.sha256
            echo "jl4-service SHA256: $(cat release-artifacts/jl4-service-linux-x64.sha256)"
          fi

          # Collect the cloud agent bundle and its language server (linux-arm64),
          # each with a SHA256.
          cp artifacts/cloud-agent/cloud-agent.cjs release-artifacts/cloud-agent.cjs
          cp artifacts/cloud-agent/cloud-agent.cjs.sha256 release-artifacts/cloud-agent.cjs.sha256
          cp artifacts/jl4-lsp-linux-arm64/jl4-lsp release-artifacts/jl4-lsp-linux-arm64
          sha256sum release-artifacts/jl4-lsp-linux-arm64 | awk '{print $1}' > release-artifacts/jl4-lsp-linux-arm64.sha256
          echo "cloud-agent.cjs SHA256: $(cat release-artifacts/cloud-agent.cjs.sha256)"
          echo "jl4-lsp-linux-arm64 SHA256: $(cat release-artifacts/jl4-lsp-linux-arm64.sha256)"

          echo "Release artifacts:"
          ls -la release-artifacts/

          # Fail if no artifacts found
          if [ -z "$(ls -A release-artifacts/)" ]; then
            echo "ERROR: No artifacts found!"
            exit 1
          fi

      - name: Get build date
        id: build-date
        run: |
          echo "date=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Create tag name
        id: tag-name
        run: |
          TAG_NAME="l4-ide-build-${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag-name.outputs.tag }}" -m "Automated build ${{ github.run_number }}

          Commit: ${{ github.sha }}
          Built: ${{ steps.build-date.outputs.datetime }}

          Artifacts included:
          - VSCode extensions (platform-specific, cross-platform, universal)
          - WASM binaries (jl4-core.wasm, jl4-core.mjs)
          - jl4-service binary (linux-x64) with SHA256
          - Claude Code plugin (l4-plugin.zip) and skill (writing-l4-rules.skill)
          - Cloud agent bundle and jl4-lsp (linux-arm64) with SHA256"
          git push origin "${{ steps.tag-name.outputs.tag }}"

      - name: Upload artifacts to tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag-name.outputs.tag }}
          name: L4 VSCode Extension & Tools (Build ${{ github.run_number }})
          body: |
            ## Build Artifacts

            **Commit:** ${{ github.sha }}
            **Built:** ${{ steps.build-date.outputs.datetime }}

            ### VSCode Extensions

            | Platform | Description |
            |----------|-------------|
            | `darwin-arm64` | macOS Apple Silicon (also works on Intel via Rosetta 2) |
            | `win32-x64` | Windows x64 |
            | `linux-x64` | Linux x64 |
            | `linux-arm64` | Linux ARM64 |
            | `cross-platform` | Single VSIX with macOS + Windows binaries |
            | `universal` | No bundled binary (requires jl4-lsp on PATH) |

            ### jl4-service (Decision Service)

            | File | Description |
            |------|-------------|
            | `jl4-service-linux-x64` | Decision service binary for Linux x86_64 |
            | `jl4-service-linux-x64.sha256` | SHA256 hash for binary verification |

            ### Cloud agent (Legalese AI cloud sessions)

            | File | Description |
            |------|-------------|
            | `cloud-agent.cjs` | Headless Legalese AI harness bundle (Node.js 24) |
            | `cloud-agent.cjs.sha256` | SHA256 hash for bundle verification |
            | `jl4-lsp-linux-arm64` | Language server for Linux ARM64, used by the harness image |
            | `jl4-lsp-linux-arm64.sha256` | SHA256 hash for binary verification |

            ### WASM Binaries

            | File | Description |
            |------|-------------|
            | `jl4-core.wasm` | L4 core WASM module |
            | `jl4-core.mjs` | JavaScript FFI glue code |

            ### Claude Code Plugin

            | File | Description |
            |------|-------------|
            | `l4-plugin.zip` | The L4 plugin: the `writing-l4-rules` skill and the plugin manifests |
            | `writing-l4-rules.skill` | The skill alone (SKILL.md and its references) |

            Install from the marketplace with `/plugin marketplace add legalese/l4-ide`, then `/plugin install l4-computational-law@legalese`; or extract `writing-l4-rules.skill` into `~/.claude/skills/writing-l4-rules/`.

            ### Installation

            **VSCode Extension:**
            ```bash
            code --install-extension l4-vscode-<platform>-*.vsix
            ```

            **macOS Security Note:**
            ```bash
            xattr -dr com.apple.quarantine ~/.vscode/extensions/legalese.l4-vscode-*/bin/darwin-*/jl4-lsp
            ```
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Deploy the web editor (play.legalese.com)
  # ============================================
  # Runs once the release exists, with that release's WASM. Until its target
  # is set as repository variables, the job is skipped.

  deploy-web-editor:
    name: Deploy Web Editor
    runs-on: ubuntu-latest
    needs:
      - build-wasm
      - create-tag
    if: ${{ vars.WEB_EDITOR_BUCKET != '' && vars.WEB_EDITOR_DISTRIBUTION_ID != '' }}
    environment:
      name: web-editor
      url: https://play.legalese.com
    permissions:
      contents: read
      id-token: write # OIDC
    env:
      RELEASE_TAG: ${{ needs.create-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: jl4-wasm-${{ needs.build-wasm.outputs.version }}
          path: ${{ runner.temp }}/wasm

      # The WASM lives under its release tag, so each release has new URLs and
      # browsers never mix a cached module with a newer page.
      - name: Configure the build for this release
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          # The session Lambda rejects shares without a Turnstile token, so a
          # build without the key would ship a Share button that always fails.
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::error::Repository variable TURNSTILE_SITE_KEY is not set"
            exit 1
          fi
          WASM_DIR="ts-apps/jl4-web/static/wasm/$RELEASE_TAG"
          mkdir -p "$WASM_DIR"
          cp "$RUNNER_TEMP/wasm/jl4-core.wasm" "$RUNNER_TEMP/wasm/jl4-core.mjs" "$WASM_DIR/"
          cat > ts-apps/jl4-web/.env.production.local <<EOF
          VITE_WASM_VERSION=$RELEASE_TAG
          VITE_WASM_URL=/wasm/$RELEASE_TAG/jl4-core.wasm
          VITE_WASM_JS_URL=/wasm/$RELEASE_TAG/jl4-core.mjs
          VITE_SESSION_URL=/session
          VITE_TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY
          EOF
          cat ts-apps/jl4-web/.env.production.local

      - name: Build web editor
        run: npx turbo build --filter=jl4-web

      - name: Configure credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Publish the web editor
        run: >-
          ts-apps/jl4-web/scripts/deploy-static.sh ts-apps/jl4-web/build
          "${{ vars.WEB_EDITOR_BUCKET }}" "${{ vars.WEB_EDITOR_DISTRIBUTION_ID }}"

  # ============================================
  # Build summary
  # ============================================

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - package-vscode-extension
      - package-vscode-cross-platform
      - package-vscode-universal
      - build-wasm
      - package-plugin
      - build-cloud-agent
      - create-tag
      - deploy-web-editor
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Main Branch Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| VSCode Extensions | ${{ needs.package-vscode-extension.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross Platform | ${{ needs.package-vscode-cross-platform.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Universal | ${{ needs.package-vscode-universal.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WASM Build | ${{ needs.build-wasm.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Claude Code Plugin | ${{ needs.package-plugin.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud Agent Bundle | ${{ needs.build-cloud-agent.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Tag | ${{ needs.create-tag.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Editor | ${{ needs.deploy-web-editor.result == 'success' && '✅' || needs.deploy-web-editor.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
