# Unstable prerelease: standalone `l4` + `jl4-lsp` binaries.
#
# STATUS 2026-08-05: WRITTEN, NEVER RUN. Nothing in this file has been executed
# on a runner. It is modelled step-for-step on main-tag.yml's four platform
# build jobs, which are green (run 29636556313, 2026-07-18, all four platforms
# `success`), but every claim below about THIS workflow's behaviour is a design
# intention, not a measurement. Run it once with `dry_run: true` (the default)
# before anyone trusts it. See §"What is unverified" at the foot of this file.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#
# `etc/go/go.sh` — the pipeline entry point — never builds; it requires `L4` to
# point at an already-built binary and refuses otherwise (go.sh:474-488), and
# `JL4_LSP_CMD` likewise for the ladder leg (etc/go/phases/p7-ladder.sh:31).
# The only `l4` we ship today is bundled inside the VS Code extension, whose
# most recent build is from 2026-07-18 — before `l4 export` existed. So a
# contributor who wants to run the pipeline currently has to install GHC and
# Cabal and do a full Haskell build to obtain a binary. On a Claude Code cloud
# sandbox, whose setup script is capped at five minutes, that is impossible;
# downloading a tarball is not.
#
# ---------------------------------------------------------------------------
# HOW THIS STAYS DISJOINT FROM main's RELEASE TRACK (main-tag.yml)
#
#   trigger      both are workflow_dispatch-only, but this one REFUSES to build
#                `main` (see the guard in the `resolve` job). main-tag.yml is
#                untouched by this file.
#   tag          `unstable-<YYYYMMDD>-<short-sha>` here; `l4-ide-build-<n>`
#                there. No existing tag in this repo starts with `unstable-`
#                (checked against all 168 tags on 2026-08-05).
#   release      `prerelease: true` + `make_latest: "false"` here, so this can
#                never displace main-tag.yml's "Latest release".
#   concurrency  group `unstable-prerelease` here, `main-release` there — two
#                groups, so neither can queue behind or cancel the other.
#   permissions  `contents: read` at the top level; `contents: write` is
#                granted to the `publish` job alone.
#   caches       this workflow RESTORES and NEVER SAVES (see the cache note in
#                the build job). It therefore cannot evict anything from the
#                repo's 10 GB cache budget, which is the failure mode
#                pr-checks.yml:701-713 was written to prevent.
#   artifacts    no VSIX, no WASM, no npm, no edit to ts-apps/vscode/package.json.
#
# ---------------------------------------------------------------------------
# THE DEFAULT-BRANCH CONSTRAINT, AND WHY THIS WORKFLOW CHECKS OUT A REF
#
# GitHub: "This event will only trigger a workflow run if the workflow file
# exists on the default branch." That holds for `workflow_dispatch` and for
# `schedule` alike. Our default branch is `main`; the branch we want to build
# is `unstable`. Two consequences, both handled here:
#
#   1. THIS FILE MUST REACH `main` BEFORE IT CAN BE DISPATCHED AT ALL. Landing
#      it on `unstable` is necessary and not sufficient — the Run-workflow
#      button appears only once `unstable` has been merged to `main`. That is a
#      known cost of this design, not an oversight.
#
#   2. Once dispatchable, the ref you select decides which COPY of the file
#      runs. To make the outcome identical either way, this workflow never
#      relies on the run's own ref: it checks out `inputs.ref` (default
#      `unstable`) explicitly, exactly as cache-warmup.yml does for the same
#      reason. Dispatch it from `main` and it still builds `unstable`.
#
# No `schedule:` trigger. A scheduled run would execute against main's latest
# commit, and — more to the point — publishing is an outward-facing act, so a
# human decides when it happens. Adding a schedule later needs only the trigger
# block: the ref plumbing below already falls back to `unstable` when `inputs`
# is absent.
name: Unstable Prerelease (l4 + jl4-lsp)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Must not be main."
        required: false
        default: "unstable"
        type: string
      dry_run:
        description: "Build, package and checksum, but create NO tag and NO release. Leave checked until this workflow has been proven once."
        required: false
        default: true
        type: boolean
      tag_suffix:
        description: "Disambiguator, e.g. 2, appended to the tag. Only needed when re-publishing the same commit on the same UTC day."
        required: false
        default: ""
        type: string

# Distinct from main-tag.yml's `main-release`, so the two release tracks never
# serialise against or cancel each other.
concurrency:
  group: unstable-prerelease
  cancel-in-progress: false

# Least privilege by default; `publish` widens this to contents: write for
# itself alone. The build jobs cannot write to the repository.
permissions:
  contents: read

env:
  # Matches pr-checks.yml:610 and main-tag.yml's GHC_VERSION. NOTE: local
  # worktrees build with 9.10.3 (CLAUDE.md §3 records 9.10.3, and
  # dist-newstyle paths on developer machines say ghc-9.10.3). CI pins 9.10.2,
  # which is the version proven green on all four runner images, and is also
  # what main-tag.yml's cabal-store caches are keyed on — so matching it is
  # what makes the cache reuse below possible.
  GHC_VERSION: "9.10.2"

jobs:
  # =========================================================================
  # Resolve the commit, compute the tag, and refuse bad inputs BEFORE we spend
  # thirty minutes of runner time discovering them.
  # =========================================================================
  resolve:
    name: Resolve ref and tag
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      sha: ${{ steps.plan.outputs.sha }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
      tag: ${{ steps.plan.outputs.tag }}
      built_at: ${{ steps.plan.outputs.built_at }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Guard first, checkout second: a `main` dispatch should cost nothing.
      - name: Refuse to build main
        env:
          REF: ${{ inputs.ref || 'unstable' }}
        run: |
          case "$REF" in
            main|refs/heads/main|origin/main)
              echo "::error::This workflow publishes the UNSTABLE prerelease track and must not"
              echo "::error::build main. main's release pipeline is .github/workflows/main-tag.yml,"
              echo "::error::which cuts l4-ide-build-<n> tags and marks them Latest. Refusing."
              exit 1
              ;;
          esac
          echo "Building ref: $REF"

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'unstable' }}
          fetch-depth: 1

      - name: Compute commit, tag and publish decision
        id: plan
        env:
          REF: ${{ inputs.ref || 'unstable' }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=7 HEAD)"
          DATE="$(date -u +%Y%m%d)"

          # Tag namespace: `unstable-<YYYYMMDD>-<short-sha>`.
          #   * `unstable-` collides with nothing — the repo's 168 existing tags
          #     use l4-ide-build-<n>, vscode-build-<n>, vscode-wasm-build-<n>,
          #     v<x.y.z>-<hex>, archive/… and backup/… (checked 2026-08-05).
          #   * The date sorts lexicographically, so `git tag --list 'unstable-*'
          #     | sort` is chronological.
          #   * The short SHA names the commit, so the tag says what it is
          #     without consulting the release page.
          #
          # TAGS ARE IMMUTABLE. This workflow never moves or deletes a tag. A
          # moving tag ("unstable-latest") would silently change what a
          # previously-recorded checksum refers to, which is exactly what the
          # SHA256SUMS file exists to prevent. The cost is that re-publishing
          # the same commit on the same UTC day collides; `tag_suffix` is the
          # escape hatch, and the pre-flight below fails fast rather than late.
          if [ -n "${TAG_SUFFIX:-}" ]; then
            case "$TAG_SUFFIX" in
              *[!A-Za-z0-9._-]*)
                echo "::error::tag_suffix must match [A-Za-z0-9._-]* — got '$TAG_SUFFIX'"
                exit 1
                ;;
            esac
            TAG="unstable-${DATE}-${SHORT}-${TAG_SUFFIX}"
          else
            TAG="unstable-${DATE}-${SHORT}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin, and this workflow never moves a tag."
            echo "::error::To publish this commit again, re-run with tag_suffix set (e.g. 2)."
            exit 1
          fi

          # Default-deny. Only the literal string "false" publishes; anything
          # else — including a null `inputs` context on some future trigger —
          # leaves this a dry run.
          if [ "${DRY_RUN:-}" = "false" ]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi

          {
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "short_sha=$SHORT"
            echo "tag=$TAG"
            echo "built_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Unstable prerelease plan"
            echo ""
            echo "| field | value |"
            echo "|-------|-------|"
            echo "| ref | \`$REF\` |"
            echo "| commit | \`$SHA\` |"
            echo "| tag | \`$TAG\` |"
            echo "| publish | \`$PUBLISH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Build both binaries, per platform.
  #
  # Every platform checks out the SHA the `resolve` job pinned, never the
  # branch name: a push to unstable mid-run must not produce a release whose
  # linux binary and macOS binary are different programs.
  # =========================================================================
  build:
    name: Build ${{ matrix.platform }}
    needs: resolve
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` reuses main-tag.yml's VS Code target naming
          # (darwin-arm64 / win32-x64 / linux-x64) so one vocabulary describes
          # both tracks. `cache_prefix` is DIFFERENT from `platform` on two of
          # the three rows, because main-tag.yml keys its cabal-store caches on
          # runner names, not target names (main-tag.yml:49, :118, :194). Using
          # `platform` there would produce a key that never matches anything.
          - platform: linux-x64
            runs-on: ubuntu-latest
            cache_prefix: lsp-linux-x64
            exe: ""
          - platform: darwin-arm64
            runs-on: macos-latest
            cache_prefix: lsp-macos-arm64
            exe: ""
          # Windows is included because it is proven, not assumed: main-tag.yml's
          # `Build jl4-lsp + l4 - Windows x64` job builds this project with GHC
          # 9.10.2 on windows-latest and was green in run 29636556313
          # (2026-07-18, ~8 minutes with a warm cache).
          - platform: win32-x64
            runs-on: windows-latest
            cache_prefix: lsp-windows-x64
            exe: ".exe"

    # bash on every platform, including Windows (Git Bash), so the steps below
    # are written once. main-tag.yml achieves the same with per-step
    # `shell: bash` on its Windows job.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: true

      # Copied from main-tag.yml:167-174, retry loop included.
      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux-x64'
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "Retry $i: apt-get update failed, waiting 10s..."
            sleep 10
          done
          sudo apt-get install -y pkg-config liblzma-dev libgmp-dev

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "latest"
          cabal-update: true

      # Configure BEFORE the cache restore: the restore key hashes plan.json,
      # which `--dry-run` is what writes. main-tag.yml orders it the same way.
      #
      # `--disable-tests`: this workflow publishes binaries. Correctness gating
      # for `unstable` is pr-checks.yml's job — it runs `cabal test all` on
      # every PR into the branch. What this workflow owes on top of that is
      # proof the ARTIFACT runs, which is the smoke test further down.
      - name: Configure and generate build plan
        run: |
          cabal update
          cabal configure --disable-tests --disable-documentation
          cabal build exe:l4 exe:jl4-lsp --dry-run

      # RESTORE-ONLY, DELIBERATELY. There is no `cache/save` anywhere in this
      # workflow, for two reasons:
      #
      #   1. The repo shares a 10 GB cache budget, and GitHub evicts by LRU.
      #      pr-checks.yml:701-713 records what happened the last time a job
      #      family wrote freely into it: the base caches that PRs inherit were
      #      evicted and PRs cold-built for ~40 minutes. A manually-triggered
      #      release track has no business competing for that space.
      #   2. Everything we need is already in main-tag.yml's `lsp-*` families,
      #      which build the same two executables from the same cabal.project
      #      with the same GHC.
      #
      # The single `path:` and the bare-runner execution are both load-bearing.
      # actions/cache derives an internal cache VERSION from the path list and
      # the compression method, and only entries with a matching version are
      # visible to a given key. So:
      #   * the path must be exactly `cabal-store` — the same single entry
      #     main-tag.yml uses. Adding dist-newstyle to the list would change
      #     the version and silently match nothing.
      #   * pr-checks.yml's `haskell` job and cache-warmup.yml both run inside
      #     `container: ubuntu:24.04`, whose apt list installs no `zstd`;
      #     this workflow runs on bare runners. I have NOT measured whether
      #     those two families are version-compatible, so this deliberately
      #     falls back only to `lsp-*`, which main-tag.yml writes from bare
      #     runners exactly like these.
      #
      # Cache SCOPE: reads are scoped to {the run's own ref, the default
      # branch}. main-tag.yml is dispatched on main (run 29636556313 reports
      # headBranch main), so its caches sit in the default-branch scope and are
      # readable from this workflow whether it is dispatched on main or on
      # unstable. A miss costs a full dependency build; it is not fatal.
      - name: Restore cabal store (never saved by this workflow)
        uses: actions/cache/restore@v5
        id: cache
        env:
          key: ${{ matrix.cache_prefix }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: |
            ${{ env.key }}-
            ${{ matrix.cache_prefix }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-

      - name: Build l4 and jl4-lsp
        run: cabal build exe:l4 exe:jl4-lsp

      # The archive extracts to a directory of its own name — `tar -xzf
      # l4-<tag>-<platform>.tar.gz` yields `l4-<tag>-<platform>/`, never a
      # scatter of files into the current directory.
      - name: Stage the payload
        id: stage
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          DIR="l4-${TAG}-${{ matrix.platform }}"
          mkdir -p "stage/${DIR}/libraries" dist

          # Unquoted $(cabal list-bin ...) mirrors main-tag.yml:148-149, which
          # is the form proven to work with the backslashed path cabal prints
          # on Windows. GITHUB_WORKSPACE contains no spaces on any runner image.
          cp $(cabal list-bin exe:l4)       "stage/${DIR}/l4${{ matrix.exe }}"
          cp $(cabal list-bin exe:jl4-lsp)  "stage/${DIR}/jl4-lsp${{ matrix.exe }}"

          # strip BEFORE codesign: stripping a Mach-O invalidates its signature.
          if [ "${{ matrix.platform }}" != "win32-x64" ]; then
            strip "stage/${DIR}/l4"      || true
            strip "stage/${DIR}/jl4-lsp" || true
            chmod +x "stage/${DIR}/l4" "stage/${DIR}/jl4-lsp"
          fi
          if [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            codesign -s - "stage/${DIR}/l4"      || true
            codesign -s - "stage/${DIR}/jl4-lsp" || true
          fi

          # The standard library is embedded in the binary by a Template
          # Haskell splice at compile time (see the sdist guard at
          # pr-checks.yml:654-684), so these copies are NOT required to run
          # `l4`. They are here so a standalone user can point
          # JL4_LIBRARY_PATH somewhere if they ever need to. Pipeline users
          # should not set it: etc/go/ defaults it to the repo's own copy.
          cp jl4-core/libraries/*.l4 "stage/${DIR}/libraries/"

          cat > "stage/${DIR}/BUILD-INFO.txt" <<EOF
          l4 + jl4-lsp — UNSTABLE PRERELEASE. Not a stable release.

          tag       ${TAG}
          commit    ${{ needs.resolve.outputs.sha }}
          ref       ${{ needs.resolve.outputs.ref }}
          platform  ${{ matrix.platform }}
          ghc       ${{ steps.setup.outputs.ghc-version }}
          built     ${{ needs.resolve.outputs.built_at }}
          run       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Built from the long-lived integration branch \`unstable\`, which is
          not the stable line. For a stable build use the VS Code extension
          released from main by .github/workflows/main-tag.yml.
          EOF

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -l "stage/${DIR}"

      # Prove the artifact runs, and prove its vintage. `l4 --help` listing an
      # `export` command is the specific check this whole track exists for: the
      # binary bundled in the newest VS Code extension (2026-07-18) predates
      # `l4 export` and therefore cannot drive the DMN/BPMN projections.
      #
      # It has to be `l4 --help`, not `l4 export --help`: `helper` is attached
      # to the top-level parser and to `nlg`/`verify` only, so every older
      # subcommand answers "Invalid option `--help'" (jl4/app/Main.hs:100-111).
      # Measured against a local 9.10.3 build on 2026-08-05: `l4 --help` exits
      # 0 and lists `  export` at two-space indent.
      - name: Smoke-test the staged binaries
        env:
          DIR: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail
          L4B="stage/${DIR}/l4${{ matrix.exe }}"
          LSPB="stage/${DIR}/jl4-lsp${{ matrix.exe }}"

          # Workspace-relative scratch files on purpose: $RUNNER_TEMP is a
          # backslashed Windows path, and backslashes are escapes in bash.
          "$L4B" --help > smoke-l4-help.txt
          if ! grep -q '^  export ' smoke-l4-help.txt; then
            echo "::error::The built l4 does not list an 'export' subcommand. Publishing it"
            echo "::error::would repeat the defect this release track exists to fix."
            cat smoke-l4-help.txt
            exit 1
          fi
          echo "l4 --help lists $(grep -c '^  [a-z]' smoke-l4-help.txt) subcommands, including export"

          "$LSPB" --help < /dev/null > smoke-lsp-help.txt
          grep -q 'language server' smoke-lsp-help.txt || {
            echo "::error::jl4-lsp --help did not identify itself as the language server."
            cat smoke-lsp-help.txt
            exit 1
          }

      # Archive INSIDE the platform job, not after download. actions/upload-artifact
      # does not preserve the executable bit; a tarball does. main-tag.yml has to
      # chmod +x after every download for exactly this reason (main-tag.yml:489-493).
      - name: Archive
        env:
          DIR: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail
          tar -czf "dist/${DIR}.tar.gz" -C stage "${DIR}"
          ls -lh dist/

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: archive-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0 # already gzipped
          retention-days: 30

  # =========================================================================
  # Collect, checksum, and (unless this is a dry run) tag and publish.
  #
  # Checksums are computed on EVERY run, dry or not, so a dry run is a
  # complete rehearsal that produces every artifact the real thing would.
  # Only the two outward-facing steps — the tag push and the release — are
  # gated.
  # =========================================================================
  publish:
    name: Checksum and publish
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag push + release creation; no other job has this
    steps:
      # fetch-depth: 0, matching main-tag.yml:634-636. Pushing a tag from a
      # shallow clone is the kind of thing that works until it does not
      # ("shallow update not allowed"), and main-tag.yml's full-depth checkout
      # is the configuration this repo has actually pushed tags from.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: archive-*

      # Flatten with find rather than with download-artifact's `merge-multiple`,
      # which is how main-tag.yml:643-656 collects its own artifacts. One fewer
      # action input to be right about.
      - name: Flatten into dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -lh dist/

      # Fail loudly on a partial set. `fail-fast: false` on the build matrix
      # means one platform can fail while the others succeed; publishing two
      # thirds of a release silently is worse than publishing nothing.
      - name: Verify the archive set is complete
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          MISSING=0
          for P in linux-x64 darwin-arm64 win32-x64; do
            F="l4-${TAG}-${P}.tar.gz"
            if [ ! -f "$F" ]; then
              echo "::error::Missing archive $F"
              MISSING=1
            fi
          done
          ls -lh
          [ "$MISSING" -eq 0 ]

      # Bare filenames, so `sha256sum -c SHA256SUMS` works from the directory
      # the archives were downloaded into.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum l4-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload SHA256SUMS as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Compose the release body
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## Unstable prerelease — NOT a stable release"
            echo ""
            echo "Standalone \`l4\` and \`jl4-lsp\` binaries built from **\`${{ needs.resolve.outputs.ref }}\`**,"
            echo "the long-lived integration branch. \`unstable\` is where feature branches land"
            echo "before a release; it is not the stable line and carries no compatibility promise."
            echo "Stable builds are the VS Code extensions released from \`main\` under the"
            echo "\`l4-ide-build-<n>\` tags."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ needs.resolve.outputs.sha }}\` |"
            echo "| branch | \`${{ needs.resolve.outputs.ref }}\` |"
            echo "| built | ${{ needs.resolve.outputs.built_at }} |"
            echo "| GHC | ${{ env.GHC_VERSION }} |"
            echo "| workflow run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "### Downloads"
            echo ""
            echo "Each archive extracts to a directory of the same name, containing \`l4\`,"
            echo "\`jl4-lsp\`, a \`libraries/\` copy of the L4 standard library, and \`BUILD-INFO.txt\`."
            echo ""
            echo "| platform | archive |"
            echo "|----------|---------|"
            echo "| Linux x86-64 | \`l4-${TAG}-linux-x64.tar.gz\` |"
            echo "| macOS Apple Silicon | \`l4-${TAG}-darwin-arm64.tar.gz\` |"
            echo "| Windows x64 | \`l4-${TAG}-win32-x64.tar.gz\` |"
            echo ""
            echo "\`\`\`bash"
            echo "TAG=${TAG}"
            echo "PLATFORM=linux-x64   # or darwin-arm64, win32-x64"
            echo "BASE=${{ github.server_url }}/${{ github.repository }}/releases/download/\$TAG"
            echo "curl -fsSLO \"\$BASE/l4-\$TAG-\$PLATFORM.tar.gz\""
            echo "curl -fsSLO \"\$BASE/SHA256SUMS\""
            echo "sha256sum --ignore-missing -c SHA256SUMS   # macOS without coreutils: shasum -a 256 --ignore-missing -c SHA256SUMS"
            echo "tar -xzf \"l4-\$TAG-\$PLATFORM.tar.gz\""
            echo "export L4=\"\$PWD/l4-\$TAG-\$PLATFORM/l4\""
            echo "export JL4_LSP_CMD=\"\$PWD/l4-\$TAG-\$PLATFORM/jl4-lsp\""
            echo "\`\`\`"
            echo ""
            echo "macOS: the binaries are ad-hoc signed on the runner, but Gatekeeper still"
            echo "quarantines downloads. If launching is refused, clear the attribute:"
            echo ""
            echo "\`\`\`bash"
            echo "xattr -dr com.apple.quarantine \"l4-\$TAG-darwin-arm64\""
            echo "\`\`\`"
            echo ""
            echo "Windows: \`tar -xzf\` is built in on Windows 10 1803 and later, in both"
            echo "PowerShell and cmd."
            echo ""
            echo "See [\`etc/go/README.md\`](${{ github.server_url }}/${{ github.repository }}/blob/${{ needs.resolve.outputs.sha }}/etc/go/README.md) for what the pipeline does with these."
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run — stopping before the tag
        if: needs.resolve.outputs.publish != 'true'
        run: |
          echo "::notice::DRY RUN. Built and checksummed ${{ needs.resolve.outputs.tag }} but created"
          echo "::notice::no tag and no release. Re-run with dry_run unchecked to publish."
          {
            echo ""
            echo "> **Dry run.** No tag was pushed and no release was created."
            echo "> Archives and \`SHA256SUMS\` are attached to this run as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      # Annotated tag pushed with git, then handed to the release action —
      # the same two-step main-tag.yml:686-704 uses. An annotated tag carries
      # its own provenance message, readable with `git show <tag>` by someone
      # who has only a clone.
      - name: Create and push the tag
        if: needs.resolve.outputs.publish == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Unstable prerelease $TAG

          NOT a stable release. Built from the integration branch
          ${{ needs.resolve.outputs.ref }}.

          Commit: ${{ needs.resolve.outputs.sha }}
          Built:  ${{ needs.resolve.outputs.built_at }}
          Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Artifacts: standalone l4 + jl4-lsp for linux-x64, darwin-arm64,
          win32-x64, with SHA256SUMS."
          git push origin "$TAG"

      - name: Publish the prerelease
        if: needs.resolve.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: l4 + jl4-lsp — unstable prerelease ${{ needs.resolve.outputs.tag }}
          body_path: RELEASE_BODY.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: false
          # Both, belt and braces: `prerelease` keeps it out of the Latest slot
          # and marks it Pre-release in the UI; `make_latest: "false"` says so
          # explicitly to the API. main-tag.yml sets the opposite of both.
          prerelease: true
          make_latest: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
