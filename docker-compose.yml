services:
  # LSP WebSocket Server
  jl4-lsp:
    build:
      context: .
      dockerfile: Dockerfile.jl4-lsp
    container_name: jl4-lsp
    ports:
      - "8000:8000"
    volumes:
      - ./jl4-core/libraries:/app/libraries:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Multi-tenant decision service
  jl4-service:
    build:
      context: .
      dockerfile: Dockerfile.jl4-service
    container_name: jl4-service
    ports:
      - "8080:8080"
    volumes:
      - jl4-service-data:/data/store
    environment:
      JL4_PORT: "8080"
      JL4_STORE_PATH: /data/store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Web Frontend
  jl4-web:
    build:
      context: .
      dockerfile: Dockerfile.jl4-web
    container_name: jl4-web
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  jl4-service-data:
    driver: local

networks:
  default:
    name: jl4-network
